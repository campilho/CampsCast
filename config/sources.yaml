# Fontes do CampsCast — arquivo vivo.
# Regra de ouro: "vá na origem". Quanto mais baixo na cadeia de valor
# (hardware -> labs -> apps), maior o impacto nos andares de cima.
# Notícia só entra no episódio se tiver FONTE PRIMÁRIA.
# Agregador serve para DESCOBRIR, nunca para CITAR.

# Ordem de varredura usada pelo agente (do mais prioritário ao menos):
scan_order:
  - labs
  - hardware
  - investors
  - abertos
  - people
  - aggregators

# Camada 1 — Labs (prioridade máxima; toda notícia nasce aqui)
labs:
  - name: Anthropic News
    url: https://www.anthropic.com/news
  # A página openai.com/news deu 403 em todas as leituras de 30/09 a 30/10
  # (33 de 33). O feed oficial abre: título, data, link e resumo de uma linha,
  # o mais recente primeiro. Serve para saber o que saiu; o post em si costuma
  # dar 403 também, e para o conteúdo vale a regra de fonte de sempre.
  - name: OpenAI News (feed RSS)
    url: https://openai.com/news/rss.xml
    # Quando o post em openai.com não abrir: portas da própria OpenAI que
    # abriram em todas as leituras de outubro. O ChatGPT lê openai.com (teste
    # do autor, 30/10); o agente, lendo da casa do autor como Claude-User, não.
    outras_portas:
      - https://model-spec.openai.com/                    # o Model Spec em si (2 de 2)
      - https://alignment.openai.com/                     # pesquisa de segurança (30 de 30)
      - https://developers.openai.com/                    # documentação e changelog da API (2 de 2)
      - https://community.openai.com/c/announcements/6    # anúncios da equipe (23 de 23)
  - name: Google — The Keyword (AI)
    url: https://blog.google/technology/ai/
  - name: Google DeepMind Blog
    url: https://deepmind.google/discover/blog/
  - name: Meta AI Blog
    url: https://ai.meta.com/blog/
  - name: Mistral AI News
    url: https://mistral.ai/news/
  # x.ai/news deu 403 em 37 dos 42 logs até 02/11, e status.x.ai também
  # fecha. Portas oficiais que abriram em 02/11, pelo mesmo leitor do agente.
  - name: xAI News
    url: https://x.ai/news
    outras_portas:
      - https://docs.x.ai/docs/models           # modelos da API: modelo novo aparece aqui
      - https://docs.x.ai/docs/release-notes    # notas por mês, sem o dia: a data se confirma em outra porta
      - https://github.com/xai-org              # SDKs e código aberto, com a data de cada atualização

# Camada 0 — Hardware / infraestrutura
hardware:
  - name: NVIDIA Blog
    url: https://blogs.nvidia.com/
  - name: AWS Machine Learning Blog
    url: https://aws.amazon.com/blogs/machine-learning/

# Camada 2 — Investidores (termômetro de mercado)
investors:
  - name: a16z
    url: https://a16z.com/
  - name: Y Combinator Blog
    url: https://www.ycombinator.com/blog
  - name: Sequoia Capital
    url: https://www.sequoiacap.com/stories/

# Camada 1b — Laboratórios de peso aberto da China (desejável). Grandes
# competidores: lançamento de modelo de fronteira deles é pauta forte. A página
# de cada um no Hugging Face abre e mostra o que saiu, com data relativa ("há
# 17 dias"); a data e o anúncio vêm da página oficial. Portas medidas em 02/11
# pelo mesmo leitor do agente; qwen.ai/research e minimax.io/news não
# renderizam o conteúdo, e z.ai/blog dá 404.
abertos:
  - name: Alibaba — Qwen
    url: https://huggingface.co/Qwen
  - name: DeepSeek
    url: https://huggingface.co/deepseek-ai
    outras_portas:
      - https://api-docs.deepseek.com/news/     # anúncios da API, sem data na página
  - name: Moonshot — Kimi
    url: https://www.moonshot.ai/               # pesquisa, com data
    outras_portas:
      - https://huggingface.co/moonshotai
  - name: Zhipu — GLM
    url: https://docs.z.ai/release-notes/new-released   # lançamentos, com data
    outras_portas:
      - https://huggingface.co/zai-org
  - name: MiniMax
    url: https://huggingface.co/MiniMaxAI

# Vozes-chave — checar em dias de rumor forte; usar com parcimônia,
# e sempre buscando o post/anúncio original por trás da fala.
people:
  - Dario Amodei
  - Sam Altman
  - Andrej Karpathy
  - Boris Cherny

# Agregadores — APENAS para checagem de cobertura. Nunca fonte primária.
aggregators:
  - name: Hacker News
    url: https://news.ycombinator.com/

# Não abrem pela leitura de páginas — não tente; procure a mesma notícia na
# origem ou em outra cobertura. Medido nas transcrições de 30/09 a 30/10.
nao_abrem:
  - domain: theneuron.ai
    medido: 403 em 12 de 12 leituras
